name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff
        run: ruff check src/ tests/

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests/

      - name: Verify executable contract
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x ./app
          ./app --version
          test "$(./app --version)" = "ctf-codec-toolkit 0.1.0"

      - name: Native Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = & .\app.cmd --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "ctf-codec-toolkit 0.1.0") { throw "launcher failed" }
